name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        env:
          TUIST_XDG_CACHE_HOME: ${{ runner.temp }}/tuist-cache
          TUIST_XDG_CONFIG_HOME: ${{ runner.temp }}/tuist-config
          TUIST_XDG_STATE_HOME: ${{ runner.temp }}/tuist-state

      - name: Verify toolchain
        run: tuist version

      - name: Select available simulator destinations
        shell: bash
        run: |
          set -euo pipefail
          iphone_udid="$(xcrun simctl list devices available --json | jq -r '[.devices[] | .[] | select(.isAvailable == true and (.name | startswith("iPhone")))][0].udid')"
          ipad_udid="$(xcrun simctl list devices available --json | jq -r '[.devices[] | .[] | select(.isAvailable == true and (.name | startswith("iPad")))][0].udid')"
          if [[ -z "$iphone_udid" || "$iphone_udid" == "null" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          if [[ -z "$ipad_udid" || "$ipad_udid" == "null" ]]; then
            echo "No available iPad simulator found" >&2
            exit 1
          fi
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$iphone_udid" >> "$GITHUB_ENV"
          echo "IPAD_DESTINATION=platform=iOS Simulator,id=$ipad_udid" >> "$GITHUB_ENV"

      - name: Run project checks
        env:
          DERIVED_DATA: ${{ runner.temp }}/swift95-derived-data
          # macOS rendering snapshots are tied to the OS image; keep their checked-in
          # references unchanged while exercising functional tests on macos-latest.
          SWIFT_TEST_ARGS: --skip MacOSIntegrationSnapshotTests
          TUIST_XDG_CACHE_HOME: ${{ runner.temp }}/tuist-cache
          TUIST_XDG_CONFIG_HOME: ${{ runner.temp }}/tuist-config
          TUIST_XDG_STATE_HOME: ${{ runner.temp }}/tuist-state
        run: make check

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: swift95-test-results
          path: |
            ${{ runner.temp }}/swift95-derived-data/Logs/Test
            ${{ runner.temp }}/tuist-state/logs
          if-no-files-found: ignore
