name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_website:
        description: Publish the validated website from main
        type: boolean
        default: false
      swift60_compatibility:
        description: Build package products with the Swift 6.0 compiler
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: ${{ inputs.swift60_compatibility && '/Applications/Xcode_16.2.app/Contents/Developer' || '/Applications/Xcode_27.1.app/Contents/Developer' }}

jobs:
  validation:
    name: Validation
    runs-on: ${{ inputs.swift60_compatibility && 'macos-15' || 'xcode-27' }}
    timeout-minutes: 60
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://swift95.dimasike.com' }}
      SNAPSHOT_TESTING_RECORD: never
      TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
      TEST_XCODEBUILD_FLAGS: >-
        -parallel-testing-enabled NO
        -collect-test-diagnostics never
        -test-timeouts-enabled YES
        -default-test-execution-time-allowance 120
        -maximum-test-execution-time-allowance 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        if: ${{ !inputs.swift60_compatibility }}
      - uses: actions/setup-node@v7
        if: ${{ !inputs.swift60_compatibility }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Determine native test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SWIFT60_COMPATIBILITY: ${{ inputs.swift60_compatibility || false }}
        run: |
          native=true
          if [[ "$SWIFT60_COMPATIBILITY" == "true" ]]; then
            native=false
          else
            node --test .github/scripts/native-test-scope.test.mjs
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              native="$(node .github/scripts/native-test-scope.mjs "$BASE_SHA" "$HEAD_SHA")"
            elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              native=false
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Run native tests: $native" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Swift compiler
        env:
          EXPECTED_XCODE_VERSION: ${{ inputs.swift60_compatibility && '16.2' || '27.1' }}
          EXPECTED_SWIFT_VERSION: ${{ inputs.swift60_compatibility && '6.0' || '6.4' }}
        run: |
          xcode_version="$(xcodebuild -version)"
          echo "$xcode_version"
          [[ "$xcode_version" == "Xcode $EXPECTED_XCODE_VERSION"$'\n'* ]]
          swift_version="$(swift --version)"
          echo "$swift_version"
          [[ "$swift_version" == *"Swift version $EXPECTED_SWIFT_VERSION."* || "$swift_version" == *"Swift version $EXPECTED_SWIFT_VERSION "* ]]

      - name: Ensure Metal compiler is available
        if: ${{ !inputs.swift60_compatibility }}
        run: |
          set -o pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain 2>&1 | xcbeautify
          fi
          xcrun --sdk macosx metal --version

      - name: Configure build paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/swift95-derived-data" >> "$GITHUB_ENV"
          echo "TUIST_XDG_CACHE_HOME=$RUNNER_TEMP/tuist-cache" >> "$GITHUB_ENV"
          echo "TUIST_XDG_CONFIG_HOME=$RUNNER_TEMP/tuist-config" >> "$GITHUB_ENV"
          echo "TUIST_XDG_STATE_HOME=$RUNNER_TEMP/tuist-state" >> "$GITHUB_ENV"
          echo "SNAPSHOT_ARTIFACTS=$RUNNER_TEMP/snapshot-failures" >> "$GITHUB_ENV"

      - name: Check Swift 6.0 compatibility
        if: inputs.swift60_compatibility
        run: make check-swift60

      - name: Check formatting
        if: ${{ !inputs.swift60_compatibility }}
        run: make lint

      - name: Run package tests
        if: steps.scope.outputs.native == 'true'
        run: make test-package

      - name: Create test simulators
        if: steps.scope.outputs.native == 'true'
        run: |
          iphone_udid="$(xcrun simctl create 'Swift95 CI iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          echo "IPHONE_SIMULATOR_UDID=$iphone_udid" >> "$GITHUB_ENV"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$iphone_udid" >> "$GITHUB_ENV"
          ipad_udid="$(xcrun simctl create 'Swift95 CI iPad' com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          echo "IPAD_SIMULATOR_UDID=$ipad_udid" >> "$GITHUB_ENV"
          echo "IPAD_DESTINATION=platform=iOS Simulator,id=$ipad_udid" >> "$GITHUB_ENV"

      - name: Run macOS, iPhone, and iPad tests
        if: steps.scope.outputs.native == 'true'
        run: |
          make build-examples test-macos-ui build-mobile-tests
          xcrun simctl bootstatus "$IPHONE_SIMULATOR_UDID" -b
          make test-ios-built
          xcrun simctl shutdown "$IPHONE_SIMULATOR_UDID"
          xcrun simctl bootstatus "$IPAD_SIMULATOR_UDID" -b
          make test-ipad-built
          xcrun simctl shutdown "$IPAD_SIMULATOR_UDID"

      - run: npm --prefix Website ci
        if: ${{ !inputs.swift60_compatibility }}
      - name: Build and validate website and API documentation
        if: ${{ !inputs.swift60_compatibility }}
        run: make website-build

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift95-validation-failures
          path: |
            ${{ runner.temp }}/snapshot-failures
            ${{ runner.temp }}/swift95-derived-data/Logs/Test
            ${{ runner.temp }}/tuist-state/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload website for publication
        if: ${{ !inputs.swift60_compatibility && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_website)) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/dist

      - name: Delete test simulators
        if: always()
        run: |
          for udid in "${IPHONE_SIMULATOR_UDID:-}" "${IPAD_SIMULATOR_UDID:-}"; do
            if [[ -n "$udid" ]]; then
              xcrun simctl shutdown "$udid" || true
              xcrun simctl delete "$udid"
            fi
          done

  deploy:
    name: Publish website
    if: ${{ !inputs.swift60_compatibility && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_website)) }}
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
