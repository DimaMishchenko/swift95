name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_website:
        description: Publish the validated website from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://swift95.dimasike.com' }}
      SNAPSHOT_TESTING_RECORD: never
      TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
      TEST_XCODEBUILD_FLAGS: >-
        -parallel-testing-enabled NO
        -collect-test-diagnostics never
        -test-timeouts-enabled YES
        -default-test-execution-time-allowance 120
        -maximum-test-execution-time-allowance 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ">=22.23.4 <23"
          check-latest: true
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Determine native test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test .github/scripts/native-test-scope.test.mjs
          native=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            native="$(node .github/scripts/native-test-scope.mjs "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            native=false
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Run native tests: $native" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Metal compiler is available
        run: |
          set -o pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain 2>&1 | xcbeautify
          fi
          xcrun --sdk macosx metal --version

      - name: Configure build paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/swift95-derived-data" >> "$GITHUB_ENV"
          echo "TUIST_XDG_CACHE_HOME=$RUNNER_TEMP/tuist-cache" >> "$GITHUB_ENV"
          echo "TUIST_XDG_CONFIG_HOME=$RUNNER_TEMP/tuist-config" >> "$GITHUB_ENV"
          echo "TUIST_XDG_STATE_HOME=$RUNNER_TEMP/tuist-state" >> "$GITHUB_ENV"
          echo "SNAPSHOT_ARTIFACTS=$RUNNER_TEMP/snapshot-failures" >> "$GITHUB_ENV"

      - name: Check formatting
        run: make lint

      - name: Run package tests
        if: steps.scope.outputs.native == 'true'
        run: make test-package

      - name: Create test simulators
        if: steps.scope.outputs.native == 'true'
        run: |
          ios_runtime="$(xcrun simctl list runtimes --json | node -e '
            const fs = require("node:fs");
            const runtimes = JSON.parse(fs.readFileSync(0, "utf8")).runtimes
              .filter(r => r.isAvailable && r.identifier.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              .sort((a, b) => b.version.localeCompare(a.version, "en", { numeric: true }));
            if (!runtimes.length) throw new Error("No available iOS simulator runtime");
            console.log(runtimes[0].identifier);
          ')"
          echo "iOS simulator runtime: $ios_runtime"
          iphone_udid="$(xcrun simctl create 'Swift95 CI iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$ios_runtime")"
          echo "IPHONE_SIMULATOR_UDID=$iphone_udid" >> "$GITHUB_ENV"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$iphone_udid" >> "$GITHUB_ENV"
          ipad_udid="$(xcrun simctl create 'Swift95 CI iPad' com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB "$ios_runtime")"
          echo "IPAD_SIMULATOR_UDID=$ipad_udid" >> "$GITHUB_ENV"
          echo "IPAD_DESTINATION=platform=iOS Simulator,id=$ipad_udid" >> "$GITHUB_ENV"

      - name: Run macOS, iPhone, and iPad tests
        if: steps.scope.outputs.native == 'true'
        run: |
          make build-examples test-macos-ui build-mobile-tests
          xcrun simctl bootstatus "$IPHONE_SIMULATOR_UDID" -b
          make test-ios-built
          xcrun simctl shutdown "$IPHONE_SIMULATOR_UDID"
          xcrun simctl bootstatus "$IPAD_SIMULATOR_UDID" -b
          make test-ipad-built
          xcrun simctl shutdown "$IPAD_SIMULATOR_UDID"

      - run: npm --prefix Website ci
      - name: Build and validate website and API documentation
        run: make website-build

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift95-validation-failures
          path: |
            ${{ runner.temp }}/snapshot-failures
            ${{ runner.temp }}/swift95-derived-data/Logs/Test
            ${{ runner.temp }}/tuist-state/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload website for publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_website))
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/dist

      - name: Delete test simulators
        if: always()
        run: |
          for udid in "${IPHONE_SIMULATOR_UDID:-}" "${IPAD_SIMULATOR_UDID:-}"; do
            if [[ -n "$udid" ]]; then
              xcrun simctl shutdown "$udid" || true
              xcrun simctl delete "$udid"
            fi
          done

  deploy:
    name: Publish website
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_website))
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
