name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run formatting and package tests
        env:
          # macOS rendering snapshots are tied to the OS image; keep their checked-in
          # references unchanged while exercising functional tests on macos-latest.
          SWIFT_TEST_ARGS: --skip MacOSIntegrationSnapshotTests
        run: make lint test-package

  platform-tests:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS UI tests
            make_target: test-macos-ui
            artifact: macos
            device_prefix: ""
            destination_variable: ""
          - name: iPhone tests
            make_target: test-ios
            artifact: iphone
            device_prefix: iPhone
            destination_variable: IOS_DESTINATION
          - name: iPad tests
            make_target: test-ipad
            artifact: ipad
            device_prefix: iPad
            destination_variable: IPAD_DESTINATION
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Select available simulator destination
        if: ${{ matrix.device_prefix != '' }}
        shell: bash
        env:
          DEVICE_PREFIX: ${{ matrix.device_prefix }}
          DESTINATION_VARIABLE: ${{ matrix.destination_variable }}
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | jq -r --arg prefix "$DEVICE_PREFIX" '[.devices[] | .[] | select(.isAvailable == true and (.name | startswith($prefix)))][0].udid')"
          if [[ -z "$udid" || "$udid" == "null" ]]; then
            echo "No available $DEVICE_PREFIX simulator found" >&2
            exit 1
          fi
          echo "$DESTINATION_VARIABLE=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.name }}
        env:
          DERIVED_DATA: ${{ runner.temp }}/swift95-derived-data
          # The latest iOS image changes UIKit rendering; keep checked-in references unchanged
          # while running the functional tests and accessibility audits.
          XCODEBUILD_TEST_FLAGS: >-
            -skip-testing:Swift95Tests/AccessibilitySnapshotTests
            -skip-testing:Swift95Tests/Workspace95SnapshotTests
          TUIST_XDG_CACHE_HOME: ${{ runner.temp }}/tuist-cache
          TUIST_XDG_CONFIG_HOME: ${{ runner.temp }}/tuist-config
          TUIST_XDG_STATE_HOME: ${{ runner.temp }}/tuist-state
        run: make ${{ matrix.make_target }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: swift95-test-results-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/swift95-derived-data/Logs/Test
            ${{ runner.temp }}/tuist-state/logs
          if-no-files-found: ignore
