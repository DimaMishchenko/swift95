version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: weekly
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
